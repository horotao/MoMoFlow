<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>节点连线弹簧 · MoMoFlow</title>
    <link rel="stylesheet" href="./node-wire-spring.css">
  </head>
  <body>
    <main class="lab">
      <header class="lab-header">
        <div>
          <h1>节点连线弹簧</h1>
          <p id="drag-help">拖动任意节点，快速变向或松手，观察连线如何回弹。</p>
        </div>
        <button class="reset" id="reset" type="button">重置位置</button>
      </header>
      <section class="canvas" aria-label="节点拖动测试画布" aria-describedby="drag-help">
        <svg class="wires" aria-hidden="true">
          <path class="text-wire" fill="none"></path>
          <path class="image-wire" fill="none"></path>
        </svg>
        <div class="node" id="text" tabindex="0" role="group" aria-label="文本节点" aria-keyshortcuts="ArrowUp ArrowDown ArrowLeft ArrowRight" aria-describedby="keyboard-help">
          <span class="node-title">文本</span>
          <span class="node-port-label output">提示词</span>
          <i class="port out text-wire" aria-hidden="true"></i>
        </div>
        <div class="node" id="generate" tabindex="0" role="group" aria-label="图像生成节点" aria-keyshortcuts="ArrowUp ArrowDown ArrowLeft ArrowRight" aria-describedby="keyboard-help">
          <span class="node-title">图像生成</span>
          <span class="node-port-label">提示词</span>
          <span class="node-port-label output">图像</span>
          <i class="port in text-wire" aria-hidden="true"></i>
          <i class="port out image-wire" aria-hidden="true"></i>
        </div>
        <div class="node" id="preview" tabindex="0" role="group" aria-label="预览节点" aria-keyshortcuts="ArrowUp ArrowDown ArrowLeft ArrowRight" aria-describedby="keyboard-help">
          <span class="node-title">预览</span>
          <span class="node-port-label">图像</span>
          <i class="port in image-wire" aria-hidden="true"></i>
        </div>
        <span id="keyboard-help" hidden>用方向键移动节点。</span>
      </section>
      <section class="controls" aria-label="弹簧设置">
        <div class="strength-control">
          <label for="strength">弹簧力度</label>
          <output id="strength-value" for="strength">45%</output>
          <input id="strength" type="range" min="0" max="100" value="45" aria-describedby="strength-help">
          <span id="strength-help">调高可放大回弹，0% 用于对照。</span>
        </div>
        <div class="presets" role="group" aria-label="力度预设">
          <button type="button" data-strength="0" aria-pressed="false">关闭</button>
          <button type="button" data-strength="45" aria-pressed="true">适中</button>
          <button type="button" data-strength="85" aria-pressed="false">强烈</button>
        </div>
        <p id="reduced-motion" role="status" hidden>系统已启用减少动态效果，连线回弹已关闭。</p>
      </section>
    </main>
    <script type="module" src="./node-wire-spring.ts"></script>
  </body>
</html>
